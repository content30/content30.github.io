  <!-- Export badges -->
  <g transform="translate(730, 350)">
    <rect x="0" y="0" width="340" height="50" rx="10" fill="#1D4533" />
    <text x="170" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#F9D2BA" text-anchor="middle">⚡ Instant CSV &amp; PNG Image Export</text>
